      ctx.fillStyle='#fff';rr(-q.r-2,-q.r-2,q.r*2+4,q.r*2+4,12);ctx.fill();ctx.shadowBlur=0;
      if(a.img.complete&&a.img.naturalWidth){ctx.save();rr(-q.r,-q.r,q.r*2,q.r*2,10);ctx.clip();ctx.drawImage(a.img,-q.r,-q.r,q.r*2,q.r*2);ctx.restore();}
      else{ctx.fillStyle=a.c;rr(-q.r,-q.r,q.r*2,q.r*2,10);ctx.fill();}
      ctx.restore();});
    // obstacles
    obs.forEach(function(o){
      ctx.save();ctx.translate(o.x,o.y);
      if(o.k==='404'){
        ctx.fillStyle='rgba(0,0,0,.18)';rr(4,o.h-2,o.w,8,4);ctx.fill();
        ctx.fillStyle='#111';rr(0,0,o.w,o.h,10);ctx.fill();
        ctx.fillStyle='#ff5c8a';rr(0,0,o.w,8,6);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='800 24px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('404',o.w/2,o.h/2+5);
      }else{
        var f=Math.floor(t/5)%2,col=o.k==='fly'?'#a855f7':'#ef4444',dk=o.k==='fly'?'#6b21a8':'#991b1b';
        var cy=o.k==='fly'?o.h*.55+Math.sin(t*.2+o.ph)*3:o.h*.6;
        // pattes
        ctx.strokeStyle=dk;ctx.lineWidth=3.5;ctx.lineCap='round';
        for(var q=0;q<3;q++){var yy=cy+4+q*5,d=((f+q)%2?5:-5);ctx.beginPath();ctx.moveTo(8,yy);ctx.lineTo(-4,yy+d+4);ctx.moveTo(o.w-8,yy);ctx.lineTo(o.w+4,yy-d+4);ctx.stroke();}
        // ailes
        if(o.k==='fly'){ctx.fillStyle='rgba(216,180,254,.75)';var fl=Math.sin(t*.9)*.6;ctx.beginPath();ctx.ellipse(o.w*.28,cy-14,16,7,-.6-fl,0,7);ctx.ellipse(o.w*.72,cy-14,16,7,.6+fl,0,7);ctx.fill();}
        // corps
        ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(o.w/2,cy,o.w/2,o.h*.34,0,0,7);ctx.fill();
        ctx.fillStyle=dk;ctx.beginPath();ctx.ellipse(o.w/2,cy+4,o.w/2-4,o.h*.2,0,0,Math.PI);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(o.w*.4,cy-8,9,4,-.3,0,7);ctx.fill();
        // yeux + antennes
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.w*.34,cy-4,6,0,7);ctx.arc(o.w*.66,cy-4,6,0,7);ctx.fill();
        ctx.fillStyle='#111';ctx.beginPath();ctx.arc(o.w*.34-2,cy-3,3,0,7);ctx.arc(o.w*.66-2,cy-3,3,0,7);ctx.fill();
        ctx.strokeStyle=dk;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.w*.38,cy-12);ctx.quadraticCurveTo(o.w*.3,cy-26,o.w*.2,cy-24);ctx.moveTo(o.w*.62,cy-12);ctx.quadraticCurveTo(o.w*.7,cy-26,o.w*.8,cy-24);ctx.stroke();
      }
      ctx.restore();});
    // joueur (pixel art)
    var duckNow=P.duck&&P.ground,px=PX;
    ctx.save();ctx.translate(P.x,P.y);
    if(st!=='over'||over>0||true){
      ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(20,2,22,5,0,0,7);ctx.fill();
      if(duckNow){ctx.translate(0,0);ctx.scale(1.15,.55);}
      var lf=!P.ground?2:(st==='run'?(Math.floor(t/6)%2===0?0:1):1);
      var bodyY=-16*px+((P.ground&&st==='run'&&lf===1)?px*.6:0);
      if(hurt&&st==='over'){ctx.rotate(-.35);}
      pix(ctx,BODY,0,bodyY,px);
      pix(ctx,LEGS[!P.ground?2:lf],0,bodyY+13*px,px);
      if(st==='over'){ctx.fillStyle='#fff';ctx.fillRect(4*px,bodyY+4*px,px,px);ctx.fillRect(8*px,bodyY+4*px,px,px);}
    }
    ctx.restore();
    // particules
    parts.forEach(function(p){
      ctx.globalAlpha=Math.min(1,p.l/20);
      if(p.txt){ctx.fillStyle=p.c;ctx.font='800 18px Inter,sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.strokeText(p.txt,p.x,p.y);ctx.fillText(p.txt,p.x,p.y);}
      else{ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}
      ctx.globalAlpha=1;});
    // flash
    if(flash>0){ctx.fillStyle='rgba(124,58,237,'+(flash/60)+')';ctx.fillRect(-20,-20,W+40,WH+40);}
    if(hurt&&shake>0){ctx.fillStyle='rgba(239,68,68,'+(shake/70)+')';ctx.fillRect(-20,-20,W+40,WH+40);}
    // HUD : score, record, icônes des apps attrapées
    ctx.setTransform(S*dpr,0,0,S*dpr,0,0);
    ctx.textBaseline='top';ctx.font='800 14px Inter,sans-serif';ctx.textAlign='left';
    var hudT=T.score+' '+Math.floor(score)+'  ·  '+T.best+' '+Math.max(best,Math.floor(score));
    var hw=ctx.measureText(hudT).width+24;ctx.fillStyle='rgba(0,0,0,.45)';rr(10,10,hw,28,14);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText(hudT,22,17);
    for(var i=0;i<4;i++){var a=APPS[i],x=14+i*34,y=48;ctx.globalAlpha=got[i]?1:.35;
      ctx.fillStyle='#fff';rr(x-2,y-2,30,30,9);ctx.fill();
      if(a.img.complete&&a.img.naturalWidth){ctx.save();rr(x,y,26,26,8);ctx.clip();ctx.drawImage(a.img,x,y,26,26);ctx.restore();}
      ctx.globalAlpha=1;}
  }

  var last=0,acc=0;
  function loop(ts){
    var dt=Math.min(64,ts-last);last=ts;acc+=dt;
    while(acc>=16.67){update();acc-=16.67;}
    draw();requestAnimationFrame(loop);
  }
  requestAnimationFrame(function(ts){last=ts;loop(ts)});
  document.addEventListener('visibilitychange',function(){if(document.hidden)acc=0;});
})();
</script>
</body>
